name: DataCamp
description: >-
  DataCamp is an online learning platform (DataCamp, Inc.) for building data and
  AI skills through interactive, browser-based courses, guided projects,
  skill/career tracks, assessments, and certifications across Python, R, SQL,
  spreadsheets, Power BI, Tableau, Git, and generative AI. Learners write and run
  real code in the browser with instant feedback. DataCamp for Business adds team
  management, learning analytics, SSO/SAML, and user provisioning for
  organizations upskilling their workforce. DataCamp does not publish a public
  developer REST API; this profile is maintained as an API Evangelist network
  company record. Individual plans are Basic (free), Premium, and Teams.
